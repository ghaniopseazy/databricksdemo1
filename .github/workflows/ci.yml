name: Databricks Ci-cd

on:
  push:
    branches:
     - main
  pull_request:
    branches:
     - main
permissions:
    id-token: write
    contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    environment: dev
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{vars.DATABRICKS_HOST}}
      DATABRICKS_CLIENT_ID: ${{vars.DATABRICKS_CLIENT_ID}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project files
        run: |
          test -f databricks.yml
          test -f resources/simple_retail_job.yml
          test -f notebooks/01_Raw_to_Bronze.ipynb
          test -f notebooks/02_Bronze_to_Silver.ipynb
          test -f notebooks/03_Silver_to_Gold.ipynb
          test -f notebooks/04_Data_Quality.ipynb
          echo "Project validation passed"
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Check Databricks CLI
        run: |
          databricks version
      - name: Validate Databricks Bundle
        run: |
          databricks bundle validate -t dev
  deploy-dev:
    name: Deploy to dev
    needs:
      - validate
    runs-on: ubuntu-latest
    envioronment: dev
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{vars.DATABRICKS_HOST}}
      DATABRICKS_CLIENT_ID: ${{vars.DATABRICKS_CLIENT_ID}}
    steps:
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Deploy to dev
        run: |
          databricks bundle deploy --target dev

  
